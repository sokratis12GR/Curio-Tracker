name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            scrot \
            python3-tk \
            python3-venv \
            xvfb

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Diagnose Tk "transparent" canvas color support
        run: |
          xvfb-run --auto-servernum .venv/bin/python -c "
          import tkinter
          r = tkinter.Tk()
          c = tkinter.Canvas(r)
          item = c.create_rectangle(0, 0, 10, 10)
          c.itemconfig(item, fill='transparent')
          print('Tk transparent canvas color: OK')
          "

      - name: Build Linux binary
        run: .venv/bin/pyinstaller --clean curio_tracker_linux.spec

      - name: Smoke test (headless launch under Xvfb)
        run: |
          chmod +x dist/HeistCurioTracker
          xvfb-run --auto-servernum dist/HeistCurioTracker &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "App exited unexpectedly during smoke test"
            exit 1
          fi
          kill "$APP_PID"

      - name: Package artifact
        run: |
          cd dist
          tar -czf HeistCurioTracker-linux-x86_64.tar.gz HeistCurioTracker
          sha256sum HeistCurioTracker-linux-x86_64.tar.gz > HeistCurioTracker-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeistCurioTracker-linux
          path: |
            dist/HeistCurioTracker-linux-x86_64.tar.gz
            dist/HeistCurioTracker-linux-x86_64.tar.gz.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HeistCurioTracker-linux-x86_64.tar.gz
            dist/HeistCurioTracker-linux-x86_64.tar.gz.sha256
